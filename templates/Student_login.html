<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Font Awesome for the Eye Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="header-bar student-bar">
        <h1>Student Record Management System</h1>
    </div>
    <div class="login-wrapper">
        <div class="login-card">
            <h2>Student Login</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% for category, message in messages %}
                <div class="flash {{ 'success' if category == 'success' else 'error' }}">{{ message }}</div>
              {% endfor %}
            {% endwith %}

            <form method="POST" action="/student/login">
                <label for="admission_no">Admission Number</label>
                <input type="text" id="admission_no" name="admission_no" placeholder="e.g. DCS-01-0123/2025" required>

                <label for="password">Password</label>
                <div class="password-container" style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="password" name="password" placeholder="••••••••" required style="width: 100%; padding-right: 40px;">
                    <i class="fa-solid fa-eye" id="togglePassword" style="position: absolute; right: 15px; cursor: pointer; color: #7a797e;"></i>
                </div>

                <button type="submit">Login</button>
            </form>
            <p class="switch-link"><a href="/student/forgot-password">Forgot password?</a></p>
            <p class="switch-link"><a href="/">Administrator login</a></p>
        </div>
    </div>

    <!-- Password Toggle Script -->
    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const passwordField = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            // Toggle the type attribute
            const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordField.setAttribute('type', type);
            
            // Toggle the eye / eye-slash icon class
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
