<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Student Portal{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-header student">
        <h1>Student Record Management System</h1>
        <span>{% block subtitle %}{% endblock %}</span>
    </div>

    <div class="layout">
        <nav class="sidebar student">
            <a href="/student/dashboard" class="{{ 'active' if request.path == '/student/dashboard' else '' }}">My Dashboard</a>
            <a href="/student/record" class="{{ 'active' if request.path == '/student/record' else '' }}">My Record</a>
            <a href="/student/report">Download Report</a>
            <a href="/student/logout">Logout</a>
        </nav>

        <main class="main-area">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
